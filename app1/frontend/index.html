<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docker Demo - Frontend</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        .status {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        .status.error {
            background: #ffebee;
            border-left-color: #f44336;
        }
        .form {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        .form input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        .form input:focus {
            outline: none;
            border-color: #667eea;
        }
        .form button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .form button:hover {
            background: #5568d3;
        }
        .init-btn {
            background: #4caf50;
            margin-bottom: 20px;
            width: 100%;
        }
        .init-btn:hover {
            background: #45a049;
        }
        .messages {
            border-top: 2px solid #eee;
            padding-top: 20px;
        }
        .message {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }
        .message-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 12px;
            color: #666;
        }
        .message-author {
            font-weight: bold;
            color: #333;
        }
        .message-text {
            color: #555;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐳 Docker Demo App</h1>
        <p class="subtitle">Demonstrating Docker Volumes & Networks</p>
        
        <div id="status" class="status">Loading...</div>
        
        <button class="form init-btn" onclick="initDatabase()">Initialize Database</button>
        
        <form class="form" onsubmit="addMessage(event)">
            <input type="text" id="author" placeholder="Your name" required>
            <input type="text" id="text" placeholder="Your message" required>
            <button type="submit">Send</button>
        </form>
        
        <div class="messages">
            <h2>Messages</h2>
            <div id="messages"></div>
        </div>
    </div>

    <script>
        const API_URL = 'http://backend:3000';

        async function checkHealth() {
            try {
                const response = await fetch(`${API_URL}/health`);
                const data = await response.json();
                document.getElementById('status').innerHTML = `✅ ${data.message} - Connected to backend via Docker network!`;
                document.getElementById('status').classList.remove('error');
            } catch (err) {
                document.getElementById('status').innerHTML = `❌ Cannot connect to backend. Make sure containers are running.`;
                document.getElementById('status').classList.add('error');
            }
        }

        async function initDatabase() {
            try {
                const response = await fetch(`${API_URL}/api/init`, { method: 'POST' });
                const data = await response.json();
                alert(data.message);
                loadMessages();
            } catch (err) {
                alert('Failed to initialize database: ' + err.message);
            }
        }

        async function loadMessages() {
            try {
                const response = await fetch(`${API_URL}/api/messages`);
                const messages = await response.json();
                const container = document.getElementById('messages');
                container.innerHTML = messages.map(msg => `
                    <div class="message">
                        <div class="message-header">
                            <span class="message-author">${msg.author}</span>
                            <span>${new Date(msg.created_at).toLocaleString()}</span>
                        </div>
                        <div class="message-text">${msg.text}</div>
                    </div>
                `).join('');
            } catch (err) {
                console.error('Failed to load messages:', err);
            }
        }

        async function addMessage(event) {
            event.preventDefault();
            const author = document.getElementById('author').value;
            const text = document.getElementById('text').value;
            
            try {
                const response = await fetch(`${API_URL}/api/messages`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ author, text })
                });
                await response.json();
                document.getElementById('text').value = '';
                loadMessages();
            } catch (err) {
                alert('Failed to add message: ' + err.message);
            }
        }

        // Initialize
        checkHealth();
        loadMessages();
        setInterval(checkHealth, 5000);
    </script>
</body>
</html>
