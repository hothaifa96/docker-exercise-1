<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Docker Task Manager — Lab 4</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      padding: 24px;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    header h1 { font-size: 2rem; color: #58a6ff; }
    header p  { color: #8b949e; margin-top: 6px; }

    .badge {
      display: inline-block;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 0.8rem;
      color: #58a6ff;
      margin: 4px;
    }

    .container { max-width: 680px; margin: 0 auto; }

    .add-form {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .add-form h2 { font-size: 1rem; margin-bottom: 12px; color: #58a6ff; }

    .form-row { display: flex; gap: 10px; }

    input[type="text"], select {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #e6edf3;
      padding: 10px 14px;
      font-size: 0.95rem;
    }

    input[type="text"] { flex: 1; }

    select { width: 130px; }

    button {
      background: #238636;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 10px 18px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background 0.2s;
    }

    button:hover { background: #2ea043; }

    .btn-danger { background: #da3633; }
    .btn-danger:hover { background: #f85149; }

    .btn-done { background: #1f6feb; }
    .btn-done:hover { background: #388bfd; }

    .stats {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-card {
      flex: 1;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 14px;
      text-align: center;
    }

    .stat-card .num  { font-size: 1.8rem; font-weight: bold; color: #58a6ff; }
    .stat-card .lbl  { font-size: 0.8rem; color: #8b949e; margin-top: 4px; }

    .task-list { list-style: none; }

    .task-item {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: border-color 0.2s;
    }

    .task-item:hover { border-color: #58a6ff; }
    .task-item.done  { opacity: 0.55; }
    .task-item.done .task-title { text-decoration: line-through; color: #8b949e; }

    .task-title { flex: 1; font-size: 0.95rem; }

    .priority {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 12px;
      border: 1px solid;
    }

    .priority.high   { color: #f85149; border-color: #f85149; }
    .priority.medium { color: #e3b341; border-color: #e3b341; }
    .priority.low    { color: #3fb950; border-color: #3fb950; }

    .task-actions { display: flex; gap: 6px; }
    .task-actions button { padding: 6px 10px; font-size: 0.8rem; }

    .error-msg {
      background: #3d1c1c;
      border: 1px solid #da3633;
      border-radius: 6px;
      padding: 10px 14px;
      color: #f85149;
      margin-bottom: 16px;
      display: none;
    }

    .server-info {
      text-align: center;
      color: #30363d;
      font-size: 0.8rem;
      margin-top: 32px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🐳 Docker Task Manager</h1>
      <p>Lab 4 — Networks + Frontend / Backend</p>
      <div>
        <span class="badge">Frontend: nginx</span>
        <span class="badge">Backend: Flask API</span>
        <span class="badge">Network: tasks-network</span>
      </div>
    </header>

    <div class="error-msg" id="error-msg">
      ⚠️ Could not connect to backend. Make sure the backend container is running on port 5000.
    </div>

    <div class="stats">
      <div class="stat-card"><div class="num" id="stat-total">0</div><div class="lbl">Total</div></div>
      <div class="stat-card"><div class="num" id="stat-pending">0</div><div class="lbl">Pending</div></div>
      <div class="stat-card"><div class="num" id="stat-done">0</div><div class="lbl">Done</div></div>
    </div>

    <div class="add-form">
      <h2>+ Add a New Task</h2>
      <div class="form-row">
        <input type="text" id="task-input" placeholder="Task title..." />
        <select id="priority-input">
          <option value="medium">Medium</option>
          <option value="high">High</option>
          <option value="low">Low</option>
        </select>
        <button onclick="addTask()">Add</button>
      </div>
    </div>

    <ul class="task-list" id="task-list"></ul>

    <div class="server-info" id="server-info">Connecting to backend...</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
