<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🐳 Docker Log Viewer — Lab 3</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f1117;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1a1d27;
      border-bottom: 1px solid #2a2d3a;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 18px; font-weight: 600; color: #fff; }
    header span { font-size: 13px; color: #6b7280; }

    .badge {
      background: #0db7ed22;
      color: #0db7ed;
      border: 1px solid #0db7ed55;
      border-radius: 20px;
      padding: 2px 10px;
      font-size: 12px;
      font-weight: 600;
      margin-left: auto;
    }

    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 260px;
      min-width: 200px;
      background: #1a1d27;
      border-right: 1px solid #2a2d3a;
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 14px 16px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #6b7280;
      border-bottom: 1px solid #2a2d3a;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    #refresh-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #6b7280;
      font-size: 15px;
      padding: 2px 4px;
      border-radius: 4px;
      transition: color 0.2s;
    }
    #refresh-btn:hover { color: #0db7ed; }

    #file-list { overflow-y: auto; flex: 1; padding: 8px 0; }

    .file-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      cursor: pointer;
      font-size: 13px;
      color: #9ca3af;
      transition: background 0.15s, color 0.15s;
      border-left: 3px solid transparent;
    }
    .file-item:hover { background: #22253a; color: #e0e0e0; }
    .file-item.active {
      background: #0db7ed15;
      color: #0db7ed;
      border-left-color: #0db7ed;
    }
    .file-item .icon { font-size: 14px; flex-shrink: 0; }

    #file-count {
      padding: 8px 16px;
      font-size: 11px;
      color: #4b5563;
      border-top: 1px solid #2a2d3a;
    }

    /* ── Main content ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .content-header {
      padding: 14px 20px;
      border-bottom: 1px solid #2a2d3a;
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 49px;
    }
    #open-file-name { font-size: 14px; font-weight: 600; color: #e0e0e0; }
    #line-count { font-size: 12px; color: #6b7280; margin-left: auto; }

    #auto-refresh-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #6b7280;
      cursor: pointer;
    }

    #log-output {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      font-size: 12.5px;
      line-height: 1.8;
    }

    .log-line { display: flex; gap: 8px; }
    .log-line:hover { background: #ffffff08; border-radius: 3px; }
    .ln { color: #4b5563; min-width: 40px; text-align: right; user-select: none; }

    .log-info  .text { color: #d1fae5; }
    .log-warn  .text { color: #fef3c7; }
    .log-error .text { color: #fecaca; }

    .tag-INFO  { color: #34d399; font-weight: 700; }
    .tag-WARN  { color: #fbbf24; font-weight: 700; }
    .tag-ERROR { color: #f87171; font-weight: 700; }

    .placeholder {
      color: #4b5563;
      font-size: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 10px;
    }
    .placeholder .emoji { font-size: 40px; }

    #status-bar {
      padding: 6px 20px;
      font-size: 11px;
      color: #6b7280;
      border-top: 1px solid #2a2d3a;
      background: #1a1d27;
    }
    .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #34d399; margin-right: 6px; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  </style>
</head>
<body>

<header>
  <span>🐳</span>
  <h1>Docker Log Viewer</h1>
  <span>Lab 3 — Volumes</span>
  <div class="badge">LIVE</div>
</header>

<div class="layout">

  <!-- Sidebar: file list -->
  <aside class="sidebar">
    <div class="sidebar-header">
      Log Files
      <button id="refresh-btn" title="Refresh file list">⟳</button>
    </div>
    <div id="file-list">
      <div class="placeholder" style="padding:30px 16px;font-size:12px;color:#4b5563;text-align:center;">
        Loading files…
      </div>
    </div>
    <div id="file-count"></div>
  </aside>

  <!-- Main: log content -->
  <main class="main">
    <div class="content-header">
      <span id="open-file-name" style="color:#4b5563;">Select a log file →</span>
      <label id="auto-refresh-label" style="margin-left:auto;">
        <input type="checkbox" id="auto-refresh" checked />
        Auto-refresh
      </label>
      <span id="line-count"></span>
    </div>
    <div id="log-output">
      <div class="placeholder">
        <div class="emoji">📂</div>
        <div>Click a log file on the left to view its contents.</div>
      </div>
    </div>
    <div id="status-bar">
      <span class="dot"></span>
      Worker is generating logs every 2 seconds into the shared volume.
    </div>
  </main>

</div>

<script src="app.js"></script>
</body>
</html>
