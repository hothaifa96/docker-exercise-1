server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Serve all static files (index.html, app.js)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api/* → backend container on the Docker network
    # Students: replace "backend" with your backend container name if different
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass         http://backend:4000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }
}
